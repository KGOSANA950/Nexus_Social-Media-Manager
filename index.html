<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Social Media Manager</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #334155;
            --twitter: #1DA1F2;
            --instagram: #E1306C;
            --linkedin: #0077b5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        .app-container { display: flex; height: 100vh; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 250px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .logo { font-size: 1.4rem; font-weight: 700; margin-bottom: 40px; color: var(--primary); display: flex; align-items: center; gap: 10px; }

        .nav-menu { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .nav-menu a { color: var(--text-muted); text-decoration: none; padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 12px; transition: 0.2s; font-weight: 500; }
        .nav-menu a:hover, .nav-menu a.active { background: rgba(59, 130, 246, 0.1); color: var(--primary); }

        .user-profile { display: flex; align-items: center; gap: 12px; padding-top: 20px; border-top: 1px solid var(--border); }
        .avatar { width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .user-info span { display: block; font-size: 0.9rem; font-weight: 600; }
        .user-info small { color: var(--text-muted); font-size: 0.75rem; }

        /* --- MAIN CONTENT --- */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }

        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .top-header h1 { font-size: 1.8rem; }
        .top-header p { color: var(--text-muted); font-size: 0.9rem; }

        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

        /* --- STATS GRID --- */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .stat-icon.twitter { background: rgba(29, 161, 242, 0.1); color: var(--twitter); }
        .stat-icon.instagram { background: rgba(225, 48, 108, 0.1); color: var(--instagram); }
        .stat-icon.linkedin { background: rgba(0, 119, 181, 0.1); color: var(--linkedin); }
        .stat-info h3 { font-size: 1.5rem; }
        .stat-info p { color: var(--text-muted); font-size: 0.85rem; }
        .trend { font-size: 0.75rem; font-weight: 600; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
        .trend.up { color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .trend.down { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

        /* --- CONTENT GRID (Feed + Composer) --- */
        .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }

        /* Scheduled Posts */
        .scheduled-posts h2 { font-size: 1.2rem; margin-bottom: 20px; }
        .feed { display: flex; flex-direction: column; gap: 15px; }
        .post-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; }
        .post-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .post-platforms i { margin-right: 8px; font-size: 1.1rem; }
        .post-platforms .fa-twitter { color: var(--twitter); }
        .post-platforms .fa-instagram { color: var(--instagram); }
        .post-platforms .fa-linkedin { color: var(--linkedin); }
        .post-date { font-size: 0.8rem; color: var(--text-muted); }
        .post-content { font-size: 0.95rem; line-height: 1.5; margin-bottom: 15px; }
        .post-actions { display: flex; gap: 10px; }
        .post-actions button { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .post-actions button:hover { border-color: var(--primary); color: var(--primary); }

        /* Composer Sidebar */
        .composer-sidebar { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); height: fit-content; }
        .composer-sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; }
        .platform-selectors { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .platform-selectors label { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
        textarea { width: 100%; height: 150px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 15px; color: var(--text-main); resize: none; font-size: 0.95rem; margin-bottom: 15px; outline: none; }
        textarea:focus { border-color: var(--primary); }
        .composer-actions { display: flex; justify-content: space-between; align-items: center; }

        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
            .sidebar { width: 80px; padding: 10px; }
            .logo span, .nav-menu a span, .user-info { display: none; }
            .nav-menu a { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-circle-nodes"></i> <span>Nexus</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="active"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></a>
                <a href="#"><i class="fas fa-pen-nib"></i> <span>Composer</span></a>
                <a href="#"><i class="fas fa-calendar-alt"></i> <span>Calendar</span></a>
                <a href="#"><i class="fas fa-chart-line"></i> <span>Analytics</span></a>
                <a href="#"><i class="fas fa-cog"></i> <span>Settings</span></a>
            </nav>
            <div class="user-profile">
                <div class="avatar">RM</div>
                <div class="user-info">
                    <span>Ronney M.</span>
                    <small>Admin</small>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div>
                    <h1>Overview</h1>
                    <p>Welcome back, here is your social performance.</p>
                </div>
                <button class="btn-primary" onclick="openComposer()"><i class="fas fa-plus"></i> New Post</button>
            </header>

            <!-- Stats Row -->
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon twitter"><i class="fab fa-twitter"></i></div>
                    <div class="stat-info">
                        <h3>12.5K</h3>
                        <p>Twitter Followers <span class="trend up">+2.1%</span></p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon instagram"><i class="fab fa-instagram"></i></div>
                    <div class="stat-info">
                        <h3>8,240</h3>
                        <p>Instagram Followers <span class="trend up">+4.5%</span></p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon linkedin"><i class="fab fa-linkedin"></i></div>
                    <div class="stat-info">
                        <h3>3,100</h3>
                        <p>LinkedIn Connections <span class="trend down">-0.5%</span></p>
                    </div>
                </div>
            </section>

            <!-- Scheduled Posts & Composer Area -->
            <div class="content-grid">
                <!-- Left: Scheduled Posts -->
                <section class="scheduled-posts">
                    <h2>Scheduled Posts</h2>
                    <div id="posts-feed" class="feed">
                        <!-- Posts will be injected here via JS -->
                    </div>
                </section>

                <!-- Right: Quick Composer -->
                <aside class="composer-sidebar" id="composerSidebar">
                    <h2>Create a Post</h2>
                    <form id="post-form">
                        <div class="platform-selectors">
                            <label><input type="checkbox" name="platform" value="twitter" checked> <i class="fab fa-twitter"></i> Twitter</label>
                            <label><input type="checkbox" name="platform" value="instagram"> <i class="fab fa-instagram"></i> Instagram</label>
                            <label><input type="checkbox" name="platform" value="linkedin"> <i class="fab fa-linkedin"></i> LinkedIn</label>
                        </div>
                        
                        <textarea id="post-content" placeholder="What do you want to share?" maxlength="280"></textarea>
                        
                        <div class="composer-actions">
                            <button type="button" class="btn-secondary"><i class="fas fa-image"></i></button>
                            <button type="button" class="btn-secondary"><i class="fas fa-smile"></i></button>
                            <button type="submit" class="btn-primary">Schedule Post</button>
                        </div>
                    </form>
                </aside>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const postForm = document.getElementById('post-form');
            const postsFeed = document.getElementById('posts-feed');
            const API_URL = '/api/posts'; // Talks to our Node.js server

            // Load existing posts from the Database
            fetchPosts();

            postForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                // 1. Get form data
                const content = document.getElementById('post-content').value.trim();
                const platforms = Array.from(document.querySelectorAll('input[name="platform"]:checked')).map(cb => cb.value);

                if (!content) return alert("Please write some content for your post.");
                if (platforms.length === 0) return alert("Please select at least one platform.");

                // 2. Send to Backend
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content, platforms })
                    });

                    if (response.ok) {
                        // Clear form and reload feed
                        postForm.reset();
                        fetchPosts();
                    } else {
                        const error = await response.json();
                        alert(`Error: ${error.error}`);
                    }
                } catch (err) {
                    console.error("Failed to connect to server", err);
                    alert("Could not connect to the server.");
                }
            });

            // Function to fetch posts from the Database
            async function fetchPosts() {
                try {
                    const response = await fetch(API_URL);
                    const posts = await response.json();

                    postsFeed.innerHTML = '';

                    if (posts.length === 0) {
                        postsFeed.innerHTML = '<p style="color: #94a3b8;">No posts scheduled yet. Create one!</p>';
                        return;
                    }

                    posts.forEach(post => {
                        // Build icons HTML
                        let iconsHTML = '';
                        if (post.platforms.includes('twitter')) iconsHTML += '<i class="fab fa-twitter"></i>';
                        if (post.platforms.includes('instagram')) iconsHTML += '<i class="fab fa-instagram"></i>';
                        if (post.platforms.includes('linkedin')) iconsHTML += '<i class="fab fa-linkedin"></i>';

                        const date = new Date(post.createdAt).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

                        const postHTML = `
                            <div class="post-card">
                                <div class="post-header">
                                    <div class="post-platforms">${iconsHTML}</div>
                                    <div class="post-date">${date}</div>
                                </div>
                                <div class="post-content">${post.content}</div>
                                <div class="post-actions">
                                    <button onclick="deletePost('${post._id}')"><i class="fas fa-trash"></i> Delete</button>
                                    <button><i class="fas fa-edit"></i> Edit</button>
                                </div>
                            </div>
                        `;
                        postsFeed.innerHTML += postHTML;
                    });

                } catch (err) {
                    console.error("Failed to load posts", err);
                }
            }

            // Function to delete a post
            window.deletePost = async function(id) {
                if (!confirm("Are you sure you want to delete this post?")) return;
                
                try {
                    const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        fetchPosts();
                    }
                } catch (err) {
                    console.error("Failed to delete", err);
                }
            };

            window.openComposer = function() {
                document.getElementById('composerSidebar').scrollIntoView({ behavior: 'smooth' });
                document.getElementById('post-content').focus();
            };
        });
    </script>
</body>
</html>
